    <video id="bg-video" autoplay muted loop playsinline>
        <source src="images/bg-video.mp4" type="video/mp4">
    </video>
    <audio id="bg-music" loop preload="auto">
        <source src="images/bg-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('bg-video');
            var music = document.getElementById('bg-music');
            var btnMute = document.getElementById('btn-mute');
            var btnPlay = document.getElementById('btn-play');

            var savedMuted = sessionStorage.getItem('mediaMuted');
            var savedPaused = sessionStorage.getItem('mediaPaused');

            // 影片永遠靜音
            video.muted = true;

            // 如果 session 記錄為真才靜音，否則預設想開聲音
            var isMuted = (savedMuted === 'true');
            music.muted = isMuted;

            function updateMuteBtn() {
                btnMute.innerHTML = music.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            }
            updateMuteBtn();

            if (savedPaused === 'true') {
                video.pause();
                btnPlay.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                // 嘗試即刻播放
                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function (error) {
                        // 有聲音自動播放被瀏覽器阻擋！強制靜音並偷偷在背景繼續播放，確保按下按鈕瞬間有聲音
                        music.muted = true;
                        updateMuteBtn();
                        sessionStorage.setItem('mediaMuted', 'true');
                        music.play().catch(function (e) { });
                    });
                }
            }

            btnMute.addEventListener('click', function (e) {
                e.stopPropagation();
                music.muted = !music.muted;
                updateMuteBtn();
                sessionStorage.setItem('mediaMuted', music.muted);

                // 防呆：如果音樂根本沒開始播，接觸解靜音時順便啟動
                if (music.paused && savedPaused !== 'true') {
                    music.play().catch(function (e) { });
                }
            });

            btnPlay.addEventListener('click', function () {
                if (video.paused) {
                    video.play();
                    music.play();
                    btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                    sessionStorage.setItem('mediaPaused', 'false');
                } else {
                    video.pause();
                    music.pause();
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    sessionStorage.setItem('mediaPaused', 'true');
                }
            });

            window.addEventListener('beforeunload', function () {
                sessionStorage.setItem('mediaMuted', music.muted);
                sessionStorage.setItem('mediaPaused', video.paused);
            });
        });
    </script>

    <!-- 🌸 純 Canvas 2D 櫻花特效（零依賴，不需要圖片） -->
    <script>
        (function () {
            // == 櫻花特效程式碼 (保持不變) ==
            var canvas = document.getElementById('sakura-canvas');
            var ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            var COLORS = [
                [255, 183, 197],
                [255, 160, 180],
                [255, 200, 210],
                [250, 140, 165],
                [255, 218, 225]
            ];

            var PETAL_COUNT = 80;
            var petals = [];

            function makePetal(startFromTop) {
                var c = COLORS[Math.floor(Math.random() * COLORS.length)];
                return {
                    x: Math.random() * canvas.width,
                    y: startFromTop ? -20 - Math.random() * 100 : Math.random() * canvas.height,
                    size: 8 + Math.random() * 14,
                    speedY: 0.25 + Math.random() * 0.45,
                    speedX: -0.1 + Math.random() * 0.3,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.025,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: 0.005 + Math.random() * 0.01,
                    swayAmp: 0.2 + Math.random() * 0.4,
                    alpha: 0.5 + Math.random() * 0.5,
                    r: c[0], g: c[1], b: c[2]
                };
            }

            for (var i = 0; i < PETAL_COUNT; i++) {
                petals.push(makePetal(false));
            }

            function drawPetal(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                var w = p.size * 0.55;
                var h = p.size;

                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.bezierCurveTo(w, -h * 0.1, w, h * 0.4, 0, h / 2);
                ctx.bezierCurveTo(-w, h * 0.4, -w, -h * 0.1, 0, -h / 2);

                var grad = ctx.createRadialGradient(0, -h * 0.1, 0, 0, 0, h / 2);
                grad.addColorStop(0, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + Math.min(1, p.alpha + 0.2).toFixed(2) + ')');
                grad.addColorStop(1, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (p.alpha * 0.3).toFixed(2) + ')');

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < petals.length; i++) {
                    var p = petals[i];

                    p.sway += p.swaySpeed;
                    p.x += p.speedX + Math.sin(p.sway) * p.swayAmp;
                    p.y += p.speedY;
                    p.angle += p.spin;

                    if (p.y > canvas.height + 30 || p.x < -60 || p.x > canvas.width + 60) {
                        petals[i] = makePetal(true);
                        petals[i].x = Math.random() * canvas.width;
                    }

                    drawPetal(petals[i]);
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>

    <!-- 📂 文章排序與篩選邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const filterCategory = document.getElementById('filter-category');
            const sortBy = document.getElementById('sort-by');
            const container = document.getElementById('posts-container');
            const items = Array.from(container.getElementsByClassName('note-item'));

            // 備份初始的 DOM 順序作為預設排序
            const initialOrder = items.slice();

            function updateView() {
                const category = filterCategory.value;
                const sortType = sortBy.value;

                // 1. 篩選 (過濾出符合條件的元素)
                let filteredItems = items.filter(item => {
                    if (category === 'all') return true;
                    return item.dataset.category === category;
                });

                // 2. 隱藏不符合條件的元素
                items.forEach(item => {
                    item.style.display = 'none';
                });

                // 3. 排序
                if (sortType !== 'default') {
                    filteredItems.sort((a, b) => {
                        if (sortType === 'upload-desc') {
                            return new Date(b.dataset.upload) - new Date(a.dataset.upload);
                        } else if (sortType === 'upload-asc') {
                            return new Date(a.dataset.upload) - new Date(b.dataset.upload);
                        } else if (sortType === 'edit-desc') {
                            return new Date(b.dataset.edit) - new Date(a.dataset.edit);
                        } else if (sortType === 'title-asc') {
                            return a.dataset.title.localeCompare(b.dataset.title, 'zh-TW');
                        } else if (sortType === 'title-desc') {
                            return b.dataset.title.localeCompare(a.dataset.title, 'zh-TW');
                        }
                        return 0;
                    });
                } else {
                    // 恢復預設排序
                    filteredItems = initialOrder.filter(item => filteredItems.includes(item));
                }

                // 4. 重排 DOM 並顯示
                filteredItems.forEach(item => {
                    item.style.display = ''; // 恢復顯示
                    container.appendChild(item); // 把 element 移動到 container 最後面
                });
            }

            filterCategory.addEventListener('change', updateView);
            sortBy.addEventListener('change', updateView);
        });
    </script>



    <!-- 🌙 深色模式切換邏輯 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
            const currentTheme = localStorage.getItem('theme');

            if (currentTheme) {
                if (currentTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                    toggleSwitch.checked = true;
                }
            }

            function switchTheme(e) {
                if (e.target.checked) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                }
            }
            toggleSwitch.addEventListener('change', switchTheme, false);
        });
    </script>
