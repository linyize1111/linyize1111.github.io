    <style>
        /* 媒體/卡片排版見 site-custom.css；此處僅保留分頁與列表模式 */
        #pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 2rem 0 1rem;
            flex-wrap: wrap;
        }

        #pagination-controls button {
            padding: 0.5em 1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: inherit;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
            min-width: 2.5em;
        }

        #pagination-controls button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.7);
        }

        #pagination-controls button.active {
            background: rgba(173, 216, 230, 0.25);
            border-color: lightblue;
            color: lightblue;
        }

        #pagination-controls button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        #page-info {
            font-size: 0.85em;
            opacity: 0.7;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        /* 列表模式檢視 */
        #posts-container.list-view {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #posts-container.list-view>article.note-item {
            display: grid;
            grid-template-columns: 4% 32% 13% 16% 16% 19%;
            align-items: center;
            width: 100%;
            padding: 0.75rem 1rem;
            margin: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease;
        }

        #posts-container.list-view>article.note-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #posts-container.list-view>article.note-item .image,
        #posts-container.list-view>article.note-item p {
            display: none;
        }

        #posts-container.list-view>article.note-item header {
            display: contents;
        }

        #posts-container.list-view>article.note-item header::before,
        #posts-container.list-view>article.note-item header::after,
        #posts-container.list-view>article.note-item header .date::before,
        #posts-container.list-view>article.note-item header .date::after {
            display: none !important;
        }

        #posts-container.list-view>article.note-item header h2 {
            margin: 0;
            font-size: 1.1em;
            text-align: left;
            padding-right: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            grid-column: 2;
            grid-row: 1;
            align-self: center;
        }

        /* 將 metadata (分類、日期) 從 .date 中分離並分配到 grid 欄位 */
        #posts-container.list-view>article.note-item header .date {
            display: contents;
            /* 讓內部的 span 可以參與 grid 排版 */
            font-size: 0.9em;
        }

        #posts-container.list-view>article.note-item header .date span {
            text-align: left;
            padding-right: 1rem;
            white-space: nowrap;
            align-self: center;
            opacity: 1;
            color: #555555 !important;
        }

        #posts-container.list-view>article.note-item header .date span.meta-cat {
            grid-column: 3;
            grid-row: 1;
        }

        #posts-container.list-view>article.note-item header .date span.meta-up {
            grid-column: 4;
            grid-row: 1;
        }

        #posts-container.list-view>article.note-item header .date span.meta-ed {
            grid-column: 5;
            grid-row: 1;
        }

        #posts-container.list-view>article.note-item .actions {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            grid-column: 6;
            grid-row: 1;
        }

        #posts-container.list-view>article.note-item .actions li {
            padding: 0;
            margin: 0;
        }

        #posts-container.list-view>article.note-item .actions .button {
            margin: 0;
            padding: 0 0.75rem;
            height: 2rem;
            line-height: 2rem;
            font-size: 0.8em;
        }

        #posts-container.list-view>article.note-item .list-index {
            grid-column: 1;
            grid-row: 1;
            padding-left: 0.5rem;
            padding-right: 1rem;
            font-weight: bold;
            opacity: 1;
            align-self: center;
            color: #555555 !important;
        }

        #posts-container:not(.list-view) .list-index {
            display: none !important;
        }
    </style>
