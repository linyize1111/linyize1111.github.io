    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('bg-video');
            var music = document.getElementById('bg-music');
            var btnMute = document.getElementById('btn-mute');
            var btnPlay = document.getElementById('btn-play');

            var savedMuted = sessionStorage.getItem('mediaMuted');
            var savedPaused = sessionStorage.getItem('mediaPaused');

            // å½±ç?æ°¸é??œéŸ³
            video.muted = true;

            // å¦‚æ? session è¨˜é??ºç??é??³ï??¦å??è¨­?³é??²éŸ³
            var isMuted = (savedMuted === 'true');
            music.muted = isMuted;

            function updateMuteBtn() {
                btnMute.innerHTML = music.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            }
            updateMuteBtn();

            if (savedPaused === 'true') {
                video.pause();
                btnPlay.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                // ?—è©¦?³åˆ»?­æ”¾
                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function (error) {
                        // ?‰è²?³è‡ª?•æ’­?¾è¢«?è¦½?¨é˜»?‹ï?å¼·åˆ¶?œéŸ³ä¸¦å·?·åœ¨?Œæ™¯ç¹¼ç??­æ”¾ï¼Œç¢ºä¿æ?ä¸‹æ??•ç¬?“æ??²éŸ³
                        music.muted = true;
                        updateMuteBtn();
                        sessionStorage.setItem('mediaMuted', 'true');
                        music.play().catch(function (e) { });
                    });
                }
            }

            btnMute.addEventListener('click', function (e) {
                e.stopPropagation();
                music.muted = !music.muted;
                updateMuteBtn();
                sessionStorage.setItem('mediaMuted', music.muted);

                // ?²å?ï¼šå??œéŸ³æ¨‚æ ¹?¬æ??‹å??­ï??¥è§¸è§???³æ??†ä¾¿?Ÿå?
                if (music.paused && savedPaused !== 'true') {
                    music.play().catch(function (e) { });
                }
            });

            btnPlay.addEventListener('click', function () {
                if (video.paused) {
                    video.play();
                    music.play();
                    btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                    sessionStorage.setItem('mediaPaused', 'false');
                } else {
                    video.pause();
                    music.pause();
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    sessionStorage.setItem('mediaPaused', 'true');
                }
            });

            window.addEventListener('beforeunload', function () {
                sessionStorage.setItem('mediaMuted', music.muted);
                sessionStorage.setItem('mediaPaused', video.paused);
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const pdfName = urlParams.get('pdf'); // ?°å?å°?PDF ?„æ”¯??
            const litName = urlParams.get('lit'); // ?°å?å°æ?å­¸ç?è¨˜ç??¯æ´
            const titleEl = document.getElementById('note-title');
            const statusEl = document.getElementById('note-status');
            const contentEl = document.getElementById('markdown-container');

            if (!fileName && !pdfName && !litName) {
                titleEl.innerText = 'ç³»çµ±?¯èª¤';
                statusEl.innerText = '?ªæ?ä¾›æ?æ¡ˆå???(Missing URL Parameter)';
                contentEl.innerHTML = '<p>è«‹å?é¦–é??®é??¸æ?è¦é–±è®€?„ç?è¨˜æ?ç°¡å ±??/p>';
                return;
            }

            if (pdfName) {
                // å¦‚æ???PDF æ¨¡å?
                const displayTitle = pdfName.replace(/_/g, ' ');
                titleEl.innerText = displayTitle.toUpperCase();
                statusEl.innerText = `æª”æ?è·¯å?: /pdfs/${pdfName}.pdf`;

                // åµŒå…¥ PDF
                contentEl.innerHTML = `
                    <div style="width: 100%; height: 85vh; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                        <iframe src="pdfs/${pdfName}.pdf" width="100%" height="100%" style="border: none;"></iframe>
                    </div>
                `;
            } else if (fileName || litName) {
                // å¦‚æ???Markdown æ¨¡å? (å­¸è?ç­†è? ???‡å­¸ç­†è?)
                const targetName = fileName || litName;
                const folderName = fileName ? 'notes' : 'literature';
                const displayTitle = targetName.replace(/_/g, ' ');

                titleEl.innerText = displayTitle.toUpperCase();
                statusEl.innerText = `æª”æ?è·¯å?: /${folderName}/${targetName}.md`;

                // è¨­å? marked.js ?¯æ´ GFM (GitHub Flavored Markdown) è¡¨æ ¼ç­‰å???
                marked.setOptions({
                    gfm: true,
                    breaks: true
                });

                fetch(`${folderName}/${targetName}.md`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(markdownText => {
                        // ç§»é™¤?€??YAML front matter ?€å¡Šï??¨å?æª”æ??‰é???--- ?€å¡Šï?
                        let cleanMarkdown = markdownText.trim();
                        while (cleanMarkdown.startsWith('---')) {
                            const endIdx = cleanMarkdown.indexOf('---', 3);
                            if (endIdx === -1) break;
                            cleanMarkdown = cleanMarkdown.slice(endIdx + 3).trimStart();
                        }

                        // å°?Markdown è½‰æ? HTML ä¸¦å???GitHub Markdown CSS
                        contentEl.innerHTML = `<div class="markdown-body" style="background: transparent; color: inherit; padding: 2em;">${marked.parse(cleanMarkdown)}</div>`;

                        // ?´æ–°æ¨™é??ºæ?ç« ç?ç¬¬ä???h1 æ¨™é?
                        const firstH1 = contentEl.querySelector('h1');
                        if (firstH1) {
                            titleEl.innerText = firstH1.textContent;
                            firstH1.remove();
                        }

                        // è®?KaTeX æ¸²æ??¸å­¸?¬å? ($...$ ??$$...$$)
                        if (window.renderMathInElement) {
                            window.renderMathInElement(contentEl, {
                                delimiters: [
                                    { left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false }
                                ],
                                throwOnError: false
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        if (window.location.protocol === 'file:') {
                            titleEl.innerText = '?¬æ?æª”æ?å®‰å…¨?åˆ¶ (CORS)';
                            statusEl.innerText = 'Local File Restriction';
                            contentEl.innerHTML = `<p>?¨ç›®?å??ºç›´?¥é??Šé???HTML æª”æ? (ä½¿ç”¨ <code>file://</code> ?”è­°)ï¼Œå??´ç€è¦½?¨ç?å®‰å…¨æ©Ÿåˆ¶ (CORS) ?»æ?äº†è???<strong>/${folderName}/${targetName}.md</strong> ?„è?æ±‚ã€?/p><p>?™ä??¯ç¶²ç«™å??‰ï??Œæ˜¯?è¦½?¨å??¨è¨­å®šï??¨åª?€è¦å?æª”æ??¨é€åˆ° GitHub Pages ä¸Šå?è§€?‹ï??–æ˜¯ä½¿ç”¨ VS Code ??Live Server å¥—ä»¶?Ÿå??¬åœ°ä¼ºæ??¨å³?¯æ­£å¸¸é¡¯ç¤ºç?è¨˜å…§å®¹ï???</p>`;
                        } else {
                            titleEl.innerText = '404 æª”æ??ªæ‰¾??;
                            statusEl.innerText = 'File Not Found';
                            contentEl.innerHTML = `<p>?¡æ?è¼‰å…¥ç­†è??‚è?ç¢ºè? <strong>/${folderName}/${targetName}.md</strong> æª”æ??¯å¦å­˜åœ¨?¼æ‚¨?„å?æ¡ˆç›®?„ä¸­ï¼Œä?æª”å?å¤§å?å¯«ç›¸ç¬¦ã€?/p>`;
                        }
                    });
            }
        });

    </script>

    <!--  ç´?Canvas 2D æ«»èŠ±?¹æ?ï¼ˆé›¶ä¾è³´ï¼Œä??€è¦å??‡ï? -->
    <script>
        (function () {
            var canvas = document.getElementById('sakura-canvas');
            var ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            var COLORS = [
                [255, 183, 197],
                [255, 160, 180],
                [255, 200, 210],
                [250, 140, 165],
                [255, 218, 225]
            ];

            var PETAL_COUNT = 80;
            var petals = [];

            function makePetal(startFromTop) {
                var c = COLORS[Math.floor(Math.random() * COLORS.length)];
                return {
                    x: Math.random() * canvas.width,
                    y: startFromTop ? -20 - Math.random() * 100 : Math.random() * canvas.height,
                    size: 8 + Math.random() * 14,
                    speedY: 0.25 + Math.random() * 0.45,
                    speedX: -0.1 + Math.random() * 0.3,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.025,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: 0.005 + Math.random() * 0.01,
                    swayAmp: 0.2 + Math.random() * 0.4,
                    alpha: 0.5 + Math.random() * 0.5,
                    r: c[0], g: c[1], b: c[2]
                };
            }

            for (var i = 0; i < PETAL_COUNT; i++) {
                petals.push(makePetal(false));
            }

            function drawPetal(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                var w = p.size * 0.55;
                var h = p.size;

                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.bezierCurveTo(w, -h * 0.1, w, h * 0.4, 0, h / 2);
                ctx.bezierCurveTo(-w, h * 0.4, -w, -h * 0.1, 0, -h / 2);

                var grad = ctx.createRadialGradient(0, -h * 0.1, 0, 0, 0, h / 2);
                grad.addColorStop(0, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + Math.min(1, p.alpha + 0.2).toFixed(2) + ')');
                grad.addColorStop(1, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (p.alpha * 0.3).toFixed(2) + ')');

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < petals.length; i++) {
                    var p = petals[i];

                    p.sway += p.swaySpeed;
                    p.x += p.speedX + Math.sin(p.sway) * p.swayAmp;
                    p.y += p.speedY;
                    p.angle += p.spin;

                    if (p.y > canvas.height + 30 || p.x < -60 || p.x > canvas.width + 60) {
                        petals[i] = makePetal(true);
                        petals[i].x = Math.random() * canvas.width;
                    }

                    drawPetal(petals[i]);
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
