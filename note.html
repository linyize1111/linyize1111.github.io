    <!--  影片與音樂背景 -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="images/bg-video.mp4" type="video/mp4">
    </video>
    <audio id="bg-music" loop preload="auto">
        <source src="images/bg-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('bg-video');
            var music = document.getElementById('bg-music');
            var btnMute = document.getElementById('btn-mute');
            var btnPlay = document.getElementById('btn-play');

            var savedMuted = sessionStorage.getItem('mediaMuted');
            var savedPaused = sessionStorage.getItem('mediaPaused');

            // 影片永遠靜音
            video.muted = true;

            // 如果 session 記錄為真才靜音，否則預設想開聲音
            var isMuted = (savedMuted === 'true');
            music.muted = isMuted;

            function updateMuteBtn() {
                btnMute.innerHTML = music.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            }
            updateMuteBtn();

            if (savedPaused === 'true') {
                video.pause();
                btnPlay.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                // 嘗試即刻播放
                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function (error) {
                        // 有聲音自動播放被瀏覽器阻擋！強制靜音並偷偷在背景繼續播放，確保按下按鈕瞬間有聲音
                        music.muted = true;
                        updateMuteBtn();
                        sessionStorage.setItem('mediaMuted', 'true');
                        music.play().catch(function (e) { });
                    });
                }
            }

            btnMute.addEventListener('click', function (e) {
                e.stopPropagation();
                music.muted = !music.muted;
                updateMuteBtn();
                sessionStorage.setItem('mediaMuted', music.muted);

                // 防呆：如果音樂根本沒開始播，接觸解靜音時順便啟動
                if (music.paused && savedPaused !== 'true') {
                    music.play().catch(function (e) { });
                }
            });

            btnPlay.addEventListener('click', function () {
                if (video.paused) {
                    video.play();
                    music.play();
                    btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                    sessionStorage.setItem('mediaPaused', 'false');
                } else {
                    video.pause();
                    music.pause();
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    sessionStorage.setItem('mediaPaused', 'true');
                }
            });

            window.addEventListener('beforeunload', function () {
                sessionStorage.setItem('mediaMuted', music.muted);
                sessionStorage.setItem('mediaPaused', video.paused);
            });
        });
    </script>

    <!-- 引入 KaTeX 用於數學公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const pdfName = urlParams.get('pdf'); // 新增對 PDF 的支援
            const titleEl = document.getElementById('note-title');
            const statusEl = document.getElementById('note-status');
            const contentEl = document.getElementById('markdown-container');

            if (!fileName && !pdfName) {
                titleEl.innerText = '系統錯誤';
                statusEl.innerText = '未提供檔案參數 (Missing URL Parameter)';
                contentEl.innerHTML = '<p>請從首頁目錄選擇要閱讀的筆記或簡報。</p>';
                return;
            }

            if (pdfName) {
                // 如果是 PDF 模式
                const displayTitle = pdfName.replace(/_/g, ' ');
                titleEl.innerText = displayTitle.toUpperCase();
                statusEl.innerText = `檔案路徑: /images/${pdfName}.pdf`;

                // 嵌入 PDF
                contentEl.innerHTML = `
                    <div style="width: 100%; height: 85vh; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                        <iframe src="images/${pdfName}.pdf" width="100%" height="100%" style="border: none;"></iframe>
                    </div>
                `;
            } else if (fileName) {
                // 如果是 Markdown 模式
                const displayTitle = fileName.replace(/_/g, ' ');
                titleEl.innerText = displayTitle.toUpperCase();
                statusEl.innerText = `檔案路徑: /notes/${fileName}.md`;

                // 設定 marked.js 支援 GFM (GitHub Flavored Markdown) 表格等功能
                marked.setOptions({
                    gfm: true,
                    breaks: true
                });

                fetch(`notes/${fileName}.md`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(markdownText => {
                        // 移除 YAML front matter
                        const cleanMarkdown = markdownText.replace(/^-{3}[\s\S]+?-{3}\n/, '');

                        // 將 Markdown 轉成 HTML 並套用 GitHub Markdown CSS
                        // 加入 data-theme 屬性以便配合深色模式切換
                        const currentTheme = localStorage.getItem('theme') || 'light';
                        contentEl.innerHTML = `<div class="markdown-body" data-theme="${currentTheme}" style="background: transparent; color: inherit; padding: 2em;">${marked.parse(cleanMarkdown)}</div>`;

                        // 讓 KaTeX 渲染數學公式 ($...$ 或 $$...$$)
                        if (window.renderMathInElement) {
                            window.renderMathInElement(contentEl, {
                                delimiters: [
                                    { left: '$$', right: '$$', display: true },
                                    { left: '$', right: '$', display: false }
                                ],
                                throwOnError: false
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        titleEl.innerText = '404 檔案未找到';
                        statusEl.innerText = 'File Not Found';
                        contentEl.innerHTML = `<p>無法載入筆記。請確認 <strong>/notes/${fileName}.md</strong> 檔案是否存在於您的專案目錄中。</p>`;
                    });
            }
        });

        //  深色模式切換邏輯
        document.addEventListener("DOMContentLoaded", () => {
            const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
            const currentTheme = localStorage.getItem('theme');
            const markdownContainer = document.getElementById('markdown-container');

            if (currentTheme) {
                if (currentTheme === 'dark') {
                    document.body.classList.add('dark-mode');
                    toggleSwitch.checked = true;
                    // 如果有 markdown-body，強制套用深色屬性
                    if (markdownContainer) markdownContainer.setAttribute('data-color-mode', 'dark');
                }
            }

            function switchTheme(e) {
                if (e.target.checked) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('theme', 'dark');
                    if (markdownContainer) markdownContainer.setAttribute('data-color-mode', 'dark');
                    if (document.querySelector('.markdown-body')) document.querySelector('.markdown-body').setAttribute('data-theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('theme', 'light');
                    if (markdownContainer) markdownContainer.removeAttribute('data-color-mode');
                    if (document.querySelector('.markdown-body')) document.querySelector('.markdown-body').removeAttribute('data-theme');
                }
            }
            toggleSwitch.addEventListener('change', switchTheme, false);
        });
    </script>

    <!--  純 Canvas 2D 櫻花特效（零依賴，不需要圖片） -->
    <script>
        (function () {
            var canvas = document.getElementById('sakura-canvas');
            var ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            var COLORS = [
                [255, 183, 197],
                [255, 160, 180],
                [255, 200, 210],
                [250, 140, 165],
                [255, 218, 225]
            ];

            var PETAL_COUNT = 80;
            var petals = [];

            function makePetal(startFromTop) {
                var c = COLORS[Math.floor(Math.random() * COLORS.length)];
                return {
                    x: Math.random() * canvas.width,
                    y: startFromTop ? -20 - Math.random() * 100 : Math.random() * canvas.height,
                    size: 8 + Math.random() * 14,
                    speedY: 0.25 + Math.random() * 0.45,
                    speedX: -0.1 + Math.random() * 0.3,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.025,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: 0.005 + Math.random() * 0.01,
                    swayAmp: 0.2 + Math.random() * 0.4,
                    alpha: 0.5 + Math.random() * 0.5,
                    r: c[0], g: c[1], b: c[2]
                };
            }

            for (var i = 0; i < PETAL_COUNT; i++) {
                petals.push(makePetal(false));
            }

            function drawPetal(p) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                var w = p.size * 0.55;
                var h = p.size;

                ctx.beginPath();
                ctx.moveTo(0, -h / 2);
                ctx.bezierCurveTo(w, -h * 0.1, w, h * 0.4, 0, h / 2);
                ctx.bezierCurveTo(-w, h * 0.4, -w, -h * 0.1, 0, -h / 2);

                var grad = ctx.createRadialGradient(0, -h * 0.1, 0, 0, 0, h / 2);
                grad.addColorStop(0, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + Math.min(1, p.alpha + 0.2).toFixed(2) + ')');
                grad.addColorStop(1, 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (p.alpha * 0.3).toFixed(2) + ')');

                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < petals.length; i++) {
                    var p = petals[i];

                    p.sway += p.swaySpeed;
                    p.x += p.speedX + Math.sin(p.sway) * p.swayAmp;
                    p.y += p.speedY;
                    p.angle += p.spin;

                    if (p.y > canvas.height + 30 || p.x < -60 || p.x > canvas.width + 60) {
                        petals[i] = makePetal(true);
                        petals[i].x = Math.random() * canvas.width;
                    }

                    drawPetal(petals[i]);
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
