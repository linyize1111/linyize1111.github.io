<!DOCTYPE HTML>
<html>

<head>
    <title>閱讀筆記 - LYZ's website</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript>
        <link rel="stylesheet" href="assets/css/noscript.css" />
    </noscript>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        #markdown-container {
            text-align: left;
        }

        #markdown-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin: 1.5em 0;
        }

        #markdown-container pre {
            background: #212931;
            color: #ffffff;
            padding: 1.5em;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1.5em 0;
        }

        #markdown-container code {
            background: rgba(144, 144, 144, 0.25);
            border-radius: 3px;
            padding: 0.25em 0.5em;
            font-family: "Courier New", monospace;
        }

        #markdown-container blockquote {
            border-left: solid 4px #ffffff;
            padding-left: 1.5em;
            font-style: italic;
            margin: 1.5em 0;
        }
    </style>
</head>

<body class="is-preload">

    <!-- 🎬 影片與音樂背景 -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="images/bg-video.mp4" type="video/mp4">
    </video>
    <audio id="bg-music" loop preload="auto">
        <source src="images/bg-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('bg-video');
            var music = document.getElementById('bg-music');
            var btnMute = document.getElementById('btn-mute');
            var btnPlay = document.getElementById('btn-play');

            var savedMuted = sessionStorage.getItem('mediaMuted');
            var savedPaused = sessionStorage.getItem('mediaPaused');

            video.muted = true;
            var isMuted = (savedMuted === 'true');
            music.muted = isMuted;

            function updateMuteBtn() {
                btnMute.innerHTML = music.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            }
            updateMuteBtn();

            if (savedPaused === 'true') {
                video.pause();
                btnPlay.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function (error) {
                        music.muted = true;
                        updateMuteBtn();
                        sessionStorage.setItem('mediaMuted', 'true');
                        music.play().catch(function (e) { });
                    });
                }
            }

            btnMute.addEventListener('click', function (e) {
                e.stopPropagation();
                music.muted = !music.muted;
                updateMuteBtn();
                sessionStorage.setItem('mediaMuted', music.muted);

                if (music.paused && savedPaused !== 'true') {
                    music.play().catch(function (e) { });
                }
            });

            btnPlay.addEventListener('click', function () {
                if (video.paused) {
                    video.play();
                    music.play();
                    btnPlay.innerHTML = '<i class="fas fa-pause"></i>';
                    sessionStorage.setItem('mediaPaused', 'false');
                } else {
                    video.pause();
                    music.pause();
                    btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    sessionStorage.setItem('mediaPaused', 'true');
                }
            });

            window.addEventListener('beforeunload', function () {
                sessionStorage.setItem('mediaMuted', music.muted);
                sessionStorage.setItem('mediaPaused', video.paused);
            });
        });
    </script>

    <!-- 🌸 櫻花特效透明層 -->
    <canvas id="sakura-canvas"
        style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>

    <!-- 🎵 右下角影片控制按鈕 -->
    <div id="video-controls">
        <button id="btn-mute" title="音效開/關"><i class="fas fa-volume-mute"></i></button>
        <button id="btn-play" title="暫停/播放"><i class="fas fa-pause"></i></button>
    </div>

    <div id="wrapper">
        <header id="header">
            <a href="index.html" class="logo">LYZ's website</a>
        </header>

        <nav id="nav">
            <ul class="links">
                <li><a href="index.html">首頁 / 筆記目錄</a></li>
                <li class="active"><a href="#">閱讀筆記</a></li>
                <li><a href="about.html">關於我</a></li>
            </ul>
        </nav>

        <div id="main">
            <section class="post">
                <header class="major">
                    <h1 id="note-title">資料載入中<br />Please Wait...</h1>
                    <p id="note-status">正在從本地資料庫抓取 Markdown 文件</p>
                </header>

                <div id="markdown-container">
                    <div style="text-align: center; padding: 50px 0;">
                        <div class="spinner"></div>
                        <p>Loading...</p>
                    </div>
                </div>
            </section>
        </div>

        <div id="copyright">
            <ul>
                <li>&copy; LYZ</li>
                <li>Design: <a href="https://html5up.net">HTML5 UP</a></li>
            </ul>
        </div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.scrollex.min.js"></script>
    <script src="assets/js/jquery.scrolly.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- 引入 marked.js 用於解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 引入 GitHub Markdown CSS 以獲得類似 HackMD 的排版 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">

    <!-- 引入 KaTeX 用於數學公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const titleEl = document.getElementById('note-title');
            const statusEl = document.getElementById('note-status');
            const contentEl = document.getElementById('markdown-container');

            if (!fileName) {
                titleEl.innerText = '系統錯誤';
                statusEl.innerText = '未提供檔案參數 (Missing URL Parameter)';
                contentEl.innerHTML = '<p>請從首頁目錄選擇要閱讀的筆記。</p>';
                return;
            }

            const displayTitle = fileName.replace(/_/g, ' ');
            titleEl.innerText = displayTitle.toUpperCase();
            statusEl.innerText = `檔案路徑: /notes/${fileName}.md`;

            // 設定 marked.js 支援 GFM (GitHub Flavored Markdown) 表格等功能
            marked.setOptions({
                gfm: true,
                breaks: true
            });

            fetch(`notes/${fileName}.md`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(markdownText => {
                    // 移除 YAML front matter
                    const cleanMarkdown = markdownText.replace(/^-{3}[\s\S]+?-{3}\n/, '');

                    // 將 Markdown 轉成 HTML 並套用 GitHub Markdown CSS
                    contentEl.innerHTML = `<div class="markdown-body" style="background: transparent; color: inherit; padding: 2em;">${marked.parse(cleanMarkdown)}</div>`;

                    // 讓 KaTeX 渲染數學公式 ($...$ 或 $$...$$)
                    if (window.renderMathInElement) {
                        window.renderMathInElement(contentEl, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    titleEl.innerText = '404 檔案未找到';
                    statusEl.innerText = 'File Not Found';
                    contentEl.innerHTML = `<p>無法載入筆記。請確認 <strong>/notes/${fileName}.md</strong> 檔案是否存在於您的專案目錄中。</p>`;
                });
        });
    </script>

    <script src="https://unpkg.com/zdog@1/dist/zdog.dist.min.js"></script>
    <script src="assets/js/mouse-effect.js"></script>


</body>

</html>
