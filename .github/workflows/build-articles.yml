name: Build static articles

# Owner-triggered from the Actions page after editing Markdown on a branch.
# No schedule, local process, or console window is involved.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor == 'linyize1111' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify articles
        run: |
          npm run articles:build
          npm test
          git diff --check
      - name: Commit generated public index to this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- content/cms/articles.json content/cms/manifest.json
          if git diff --cached --quiet; then
            echo 'Article index is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build static article index from Markdown'
          git push origin "HEAD:$BRANCH"
